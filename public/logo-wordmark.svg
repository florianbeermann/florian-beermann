<svg xmlns="http://www.w3.org/2000/svg" viewBox="287.7 790.6 924.6 131.2" width="924.6" height="131.2" role="img" aria-label="Florian Beermann &amp; Partners">
  <title>Florian Beermann &amp; Partners</title>
  <!-- The wordmark, and the whole brand. Two lines: the name letterspaced light
       across the top, "&amp;PARTNERS" beneath it with the ampersand reversed out of
       a solid tile in paper. The tile is the one piece of the old monogram that
       survived its retirement, and it is the reason this file carries a second
       colour: the ampersand is painted #f3f0e8 rather than knocked through, so
       the artwork only sits correctly on paper.

       Supplied on a 1500x1500 canvas with the drawing floating in the middle of
       it. The viewBox here is cropped to the ink itself (924.6 x 131.2, 7.05:1) so
       the header can size it by height without paying for whitespace, and so
       nothing downstream has to guess where the artwork actually starts. -->
