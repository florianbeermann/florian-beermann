  <title>Florian Beermann &amp; Partners</title>
  <!-- The wordmark, and the whole brand: "FLORIAN BEERMANN" letterspaced at
       0.92em across the top, "& PARTNERS" centred beneath it on the name's ink,
       with the ampersand knocked out of a solid square tile.

       Set in Outfit 200 (SIL Open Font License 1.1, see fonts/LICENSE-OUTFIT.txt)
       and converted to outlines, so the mark never waits on a webfont and never
       reflows if one fails. Two paths only: the type, and the tile.

       The tile is a true square of 1.60 cap heights, and the ampersand is a
       genuine hole in it under fill-rule="evenodd" rather than a second colour
       painted on top. The drawing this replaced did paint it, which is why that
       file only sat correctly on paper. This one is a single colour and
       composites over any ground, so the on-ink variant differs from it in
       exactly one attribute.

       viewBox is cropped to the ink (2335.45 x 197.78, 11.81:1) so the header can size
       it by height without paying for whitespace. Caps are 68.2 of those 197.78
       units, 34.5%, and that share is what the header's height clamp reasons
       about: per pixel of height this cut prints about 20% larger than the
       7.07:1 drawing before it.

       Generated, not hand-edited. Regenerate rather than patching path data. -->
