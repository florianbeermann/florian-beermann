<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Social preview source</title>
    <!--
      The source for `public/social-preview.jpg` — the card that renders when the
      site is shared. It is a page rather than a drawing because the card has to
      be set in the site's own faces at the site's own weights and tracking, and
      re-drawing that by hand in a generator would drift the moment the type
      moved. It has drifted twice anyway, which is the argument for regenerating
      it whenever the world changes rather than only when the copy does.

        npm run dev
        open http://localhost:5199/scripts/social-card.html
        # capture the 1200x630 viewport to public/social-preview.jpg

      Two cards have been retired here. The first carried the "fb" monogram,
      rounded blob shapes and a white ground. The second was the plum world —
      plum stock, ivory type, Outfit, and a halftone cut of the portrait — and
      it outlived that world by long enough to be the last thing anyone saw of
      it, because a share card is the one surface a visitor meets before the
      site loads.
    -->
    <style>
      @font-face {
        font-family: "Switzer";
        src: url("/fonts/Switzer-Variable.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-display: block;
      }

      @font-face {
        font-family: "Nippo";
        src: url("/fonts/Nippo-Variable.woff2") format("woff2-variations");
        font-weight: 200 700;
        font-display: block;
      }

      @font-face {
        font-family: "Fragment Mono";
        src: url("/fonts/FragmentMono-Regular.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }

      :root {
        --ink: #181d26;
        --paper: #f1f2f3;
        --blue: #0047ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        display: grid;
        grid-template-columns: 1fr 450px;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        /* The sheet, not the stock. The card sets its second sentence in the
           signal, and the signal is a colour that prints on paper: measured,
           blue on the ink is 2.69:1, under even the 3:1 a headline is allowed,
           where blue on the paper is 5.34:1. It is also what the page does —
           a light band takes the voltage for its heading, a dark one takes the
           paper. A card whose ground disagrees with the site's own rule is a
           card that will drift again. */
        background: var(--paper);
        color: var(--ink);
        font-family: "Switzer", sans-serif;
      }

      .copy {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 52px 48px 44px;
      }

      /* Mark and wordmark, the same pairing the closing panel and the legal
         pages use. */
      .lockup {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .lockup svg {
        /* The anvil's own ratio (1021x524), so the mark is not squashed to the
           old drawing's near-square box. 34px is the width the old mark took,
           which is the footprint this lockup was composed around. */
        width: 34px;
        height: auto;
        aspect-ratio: 1021.1 / 524;
        color: var(--blue);
      }

      .lockup span {
        font-family: "Nippo", serif;
        font-size: 21px;
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: 1;
      }

      /* The hero's own setting: 520, tight tracking, and a line-height under 1
         so the four lines read as one block. */
      h1 {
        margin: 0;
        max-width: 15ch;
        font-size: 60px;
        font-weight: 520;
        letter-spacing: -0.03em;
        line-height: 0.94;
      }

      h1 span {
        color: var(--blue);
      }

      /* The machine voice, at the one size and tracking it takes everywhere. */
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 24px;
        border-top: 1px solid rgb(24 29 38 / 0.28);
        color: rgb(24 29 38 / 0.66);
        padding-top: 18px;
        font-family: "Fragment Mono", monospace;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        font-weight: 400;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      /* The portrait as it is: a neutral black-and-white master, not a duotone.
         The halftone cut this used to show was mixed for the plum, and a tinted
         plate beside a cool sheet reads as a colour cast. */
      .plate {
        position: relative;
        overflow: hidden;
        background: #0f1319;
      }

      .plate img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 22%;
      }

      .caption {
        position: absolute;
        right: 24px;
        top: 22px;
        color: var(--paper);
        font-family: "Fragment Mono", monospace;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="lockup">
        <svg viewBox="115.9 379 1021.1 524" aria-hidden="true">
          <g transform="translate(0,1254) scale(0.1,-0.1)" fill="currentColor">

          </g>
        </svg>
        <span>Florian Beermann &amp; Partners</span>
      </div>
      <h1>
        Your customers changed.
        <span>Your Customer Success motion did not.</span>
      </h1>
      <div class="foot">
        <span>Customer Success consulting</span>
        <span>florianbeermann.com</span>
      </div>
    </div>
    <div class="plate">
      <img src="/portrait.jpg" alt="" />
      <span class="caption">Fig. 01</span>
    </div>
  </body>
</html>
