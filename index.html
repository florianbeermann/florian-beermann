<!doctype html>

    <!-- `viewport-fit=cover` is load-bearing, not a flourish. Without it iOS
         keeps the layout viewport below the status bar while still scrolling
         the document under it, so page content appears in a strip above the
         frame that no `fixed` or `sticky` layer can reach. Covering hands that
         strip to the page; the shell claims it back with the safe-area insets
         in shell.css. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Matched to the paper, not to the header's old navy and not to the
         painting. The browser paints this above the viewport, so the honest
         value is whatever sits under the chrome, and that changes as the page
         moves: the painting band at rest, the paper glaze once anything has
         scrolled. Paper is the one value that is never wrong -- it is the
         sheet's own ground and what the glaze settles to. Navy was matched to
         a header that no longer exists and read as a hard bar above a warm
         painting. -->
    <meta name="theme-color" content="#f3f0e8" />

    <!-- The intro (backdrop holds, then the sheet arrives) plays once per
         session. This runs before first paint so a repeat load never flashes
         hidden content. If sessionStorage is unavailable, skip the intro
         rather than replaying it on every navigation. -->
    <script>
      (function () {
        try {
          if (sessionStorage.getItem("fb-intro") === "seen") {
            document.documentElement.classList.add("intro-done");
          } else {
            sessionStorage.setItem("fb-intro", "seen");
          }
        } catch (e) {
          document.documentElement.classList.add("intro-done");
        }
      })();
    </script>
