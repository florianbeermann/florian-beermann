<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is load-bearing, not a flourish. Without it iOS
         keeps the layout viewport below the status bar while still scrolling
         the document under it, so page content appears in a strip above the
         frame that no `fixed` or `sticky` layer can reach. Covering hands that
         strip to the page; the shell claims it back with the safe-area insets
         in shell.css. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Florian Beermann &amp; Partners</title>
    <meta name="description" content="I rebuild Customer Success for B2B SaaS companies whose customer base has outgrown the way they serve it: coverage, health scoring and playbooks that fit.">
    <meta name="author" content="Florian Beermann &amp; Partners" />
    <!-- The frame, not the paper. The browser paints this above the viewport,
         so the honest value is whatever sits under the chrome -- and that is
         now unambiguous. The old answer had to hedge between a painting band at
         rest and a paper glaze after scrolling, so paper was picked as the
         value that was never wrong. The backdrop is a flat field of the ink
         now, so it is the same colour at every scroll position and the chrome
         can simply continue it: the frame runs off the top of the screen into
         the status bar instead of stopping at a seam. -->
    <meta name="theme-color" content="#1E2019" />
    <link rel="canonical" href="https://florianbeermann.com/" />

    <link rel="preload" as="font" type="font/woff2" href="/fonts/Switzer-Variable.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/FragmentMono-Regular.woff2" crossorigin />
    <!-- The photograph is the page's LCP element and it is rendered by React,
         so it does not exist in the served HTML at all — the browser cannot
         discover it until the stylesheet and the module graph have resolved.
         Preloading pulls it into the first round trip alongside the faces.

         `imagesrcset` and `imagesizes` have to restate the image element's
         own candidates exactly. If they drift, the preload fetches one file
         and the element picks a different one, and the page pays for both.

         The `500vw` branch is not a typo. Below 48rem the photograph is laid
         out 132% of the hero's height and `cover` then scales it to fill —
         which draws it about 4.3x wider than the viewport, before the drift
         animation scales it a further 22%. Declared as 100vw the browser sizes
         for 390px, picks the 1000w file and upscales it better than
         threefold. The desktop branch carries the same 22% for the same
         reason. -->
    <link
      rel="preload"
      as="image"
      href="/photo/alster-1400.jpg"
      imagesrcset="/photo/alster-700.jpg 700w, /photo/alster-1000.jpg 1000w, /photo/alster-1400.jpg 1400w, /photo/alster-1800.jpg 1800w, /photo/alster-2000.jpg 2000w"
      imagesizes="(max-width: 48rem) 560vw, 140vw"
      fetchpriority="high"
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://florianbeermann.com/" />
    <meta property="og:site_name" content="Florian Beermann & Partners" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:image" content="https://florianbeermann.com/social-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Florian Beermann & Partners: Customer Success strategy for B2B SaaS" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://florianbeermann.com/social-preview.jpg" />
    <meta name="twitter:image:alt" content="Florian Beermann & Partners: Customer Success strategy for B2B SaaS" />
    <meta property="og:title" content="Your customers changed. Your Customer Success motion didn’t.">
    <meta name="twitter:title" content="Your customers changed. Your Customer Success motion didn’t.">
    <meta property="og:description" content="I rebuild Customer Success for B2B SaaS companies whose customer base has outgrown the way they serve it: coverage, health scoring and playbooks that fit.">
    <meta name="twitter:description" content="I rebuild Customer Success for B2B SaaS companies whose customer base has outgrown the way they serve it: coverage, health scoring and playbooks that fit.">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Florian Beermann & Partners",
        "url": "https://florianbeermann.com/",
        "logo": "https://florianbeermann.com/logo-lockup.png",
        "image": "https://florianbeermann.com/social-preview.jpg",
        "description": "Customer Success strategy, playbooks and operations for B2B SaaS teams.",
        "founder": {
          "@type": "Person",
          "name": "Florian Beermann",
          "jobTitle": "Customer Success consultant",
          "sameAs": "https://www.linkedin.com/in/florian-beermann"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Hamburg",
          "addressCountry": "DE"
        },
        "areaServed": "Europe",
        "serviceType": ["Customer Success Strategy", "Customer Success Playbooks", "CSM Training"]
      }
    </script>

    <!-- The intro (backdrop holds, then the sheet arrives) plays once per
         session. This runs before first paint so a repeat load never flashes
         hidden content. If sessionStorage is unavailable, skip the intro
         rather than replaying it on every navigation. -->
    <script>
      (function () {
        try {
          if (sessionStorage.getItem("fb-intro") === "seen") {
            document.documentElement.classList.add("intro-done");
          } else {
            sessionStorage.setItem("fb-intro", "seen");
          }
        } catch (e) {
          document.documentElement.classList.add("intro-done");
        }
      })();
    </script>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
