name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The FTPS step syncs into a live directory and keeps its own state file on the
# server, so two deploys must never run at once. Queue them instead of
# cancelling: a run cancelled mid-upload would leave the site half-written.
concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🎉 Deploy Website
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7

      - name: 🔧 Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🧪 Test
        run: npm test

      - name: 🏗️ Build Project
        run: npm run build
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}

      # Lets anything ask the live site which commit it is serving. The
      # scheduled drift check reads this to tell "deployed" from "assumed
      # deployed" — the two looked identical the day Actions dropped our
      # push events on the floor.
      - name: 🔖 Stamp the build with its commit
        run: |
          printf '{"commit":"%s","builtAt":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json
          cat dist/version.json

      # The gate is built here rather than committed, because this repository is
      # public: both the password hash and the access token derived from it would
      # otherwise be readable in the source. `public/.htaccess` ships an
      # `__ACCESS_TOKEN__` placeholder that only this step can resolve, and
      # `gate-secrets.php` is written here and exists nowhere in git.
      #
      # The .htaccess is what decides whether the site is gated, not this
      # workflow and not the presence of a secret. Delete the gate block from
      # that file and this step stands down on its own; leave the block in and
      # every failure below stops the deploy before a single byte is uploaded.
      # That asymmetry is the point: going public has to be a reviewed change to
      # the file whose job is protection, while a missing secret can only ever
      # cost a deploy, never open the site.
      - name: 🔒 Build the pre-launch gate
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          set -euo pipefail

          if ! grep -q '__ACCESS_TOKEN__' dist/.htaccess; then
            # Half a gate is worse than either whole. `Require env FB_ACCESS`
            # with nothing left to set that variable denies every request
            # including the owner's, so the site is down rather than open --
            # safe, but a failure nobody chose. Say so here, where the message
            # can explain it, rather than on the server where it cannot.
            if grep -q '^Require env FB_ACCESS' dist/.htaccess; then
              echo "::error::.htaccess still requires the access cookie but no longer carries the token placeholder, so nothing can ever set it and the site is closed to everyone. Remove the entire PRE-LAUNCH GATE block to publish, or restore the SetEnvIf line."
              exit 1
            fi
            echo "No pre-launch gate in .htaccess. Publishing the site openly."
            rm -f dist/login.php
            exit 0
          fi

          if [ -z "${SITE_PASSWORD}" ]; then
            echo "::error::SITE_PASSWORD is not set, so the gate cannot be built and the deploy is stopping. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          if ! command -v php >/dev/null 2>&1; then
            echo "::error::PHP is not available on the runner, so the password hash cannot be generated."
            exit 1
          fi

          # The cookie's value. Derived from the password rather than random so
          # it is stable across deploys -- a fresh token every deploy would sign
          # everyone out on every push. Deriving it also means rotating the
          # password rotates the token, which signs everyone out exactly when
          # that is the intention.
          #
          # It is an HMAC rather than a plain hash so the token cannot be
          # confirmed against a guessed password by anyone who only has the
          # token, and hex so it is safe inside both a regex and a cookie.
          token=$(printf '%s' "${SITE_PASSWORD}" | openssl dgst -sha256 -hmac 'fb-gate-v1' | awk '{print $NF}')

          # Actions masks a secret's exact value but nothing computed from it,
          # and this repository's logs are public. The token is password-
          # equivalent -- anyone holding it can set the cookie themselves -- so
          # it must never be printable, including by an error message below.
          echo "::add-mask::${token}"

          # Read from the environment, never from argv: a password on a command
          # line is visible in the runner's process list.
          hash=$(php -r 'echo password_hash(getenv("SITE_PASSWORD"), PASSWORD_BCRYPT);')
          echo "::add-mask::${hash}"

          # Single-quoted PHP literals: a bcrypt hash is full of `$`, which
          # would be interpolated inside double quotes and silently corrupt the
          # hash into something no password matches. bcrypt's alphabet contains
          # no single quote or backslash, so single quotes need no escaping.
          printf "<?php\ndefine('FB_PASSWORD_HASH', '%s');\ndefine('FB_ACCESS_TOKEN', '%s');\n" \
            "${hash}" "${token}" > dist/gate-secrets.php

          sed -i "s|__ACCESS_TOKEN__|${token}|" dist/.htaccess

          if grep -q '__ACCESS_TOKEN__' dist/.htaccess; then
            echo "::error::The access token placeholder survived substitution, so nothing can satisfy the gate and the site would be closed to everyone."
            exit 1
          fi

          if ! grep -q '^Require env FB_ACCESS' dist/.htaccess; then
            echo "::error::dist/.htaccess sets the access environment variable but never requires it. Refusing to deploy a gate that does not close."
            exit 1
          fi

          # login.php is the one file served to the unauthenticated, so it is the
          # one file that must not contain what it is protecting.
          if grep -qE "\\\$2[aby]\\\$|${token}" dist/login.php; then
            echo "::error::login.php contains the password hash or the access token. It is readable without credentials by design, so neither can live in it -- they belong in gate-secrets.php, which .htaccess denies."
            exit 1
          fi

          # A syntax error here is a site nobody can sign in to, and it would only
          # surface after the upload. The runner has PHP; use it.
          php -l dist/login.php
          php -l dist/gate-secrets.php

          echo "GATE_ACTIVE=1" >> "$GITHUB_ENV"
          echo "Gate built."

      - name: 📂 Sync files to Hetzner
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HETZNER_FTP_SERVER }}
          username: ${{ secrets.HETZNER_FTP_USERNAME }}
          password: ${{ secrets.HETZNER_FTP_PASSWORD }}
          local-dir: ./dist/
          # Change this to public_html/ or similar if your website files reside in a subfolder on Hetzner
          server-dir: ${{ secrets.HETZNER_FTP_DIR || './' }}
          protocol: ftps

      # A green FTPS step means "we uploaded", not "the site changed". Read the
      # stamp back off the live origin so the run only passes when the deploy
      # is actually visible to visitors.
      - name: ✅ Confirm the live site serves this commit
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            live=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "https://florianbeermann.com/version.json?cb=${GITHUB_RUN_ID}-${attempt}" \
              | jq -r '.commit') || live="unreachable"
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live site is serving ${GITHUB_SHA}."
              exit 0
            fi
            echo "Attempt ${attempt}: live reports '${live}', expected '${GITHUB_SHA}'. Retrying in 15s."
            sleep 15
          done
          echo "::error::Deploy reported success but https://florianbeermann.com is still serving '${live}'. The upload did not land."
          exit 1

      # A gate that is configured is not a gate that is closed. Every check here
      # is one the deploy cannot make locally: whether Apache applied the
      # .htaccess, whether the host actually executes PHP, and whether the
      # password in the secret is the one that opens the site. The whole login
      # flow is exercised rather than inspected, because the parts that can fail
      # are the joins between them.
      - name: 🔒 Confirm the gate is closed
        if: env.GATE_ACTIVE == '1'
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          set -euo pipefail

          origin="https://florianbeermann.com"
          url="${origin}/?cb=${GITHUB_RUN_ID}"

          anon=$(curl -s -o /tmp/gate.html -w '%{http_code}' --max-time 20 \
            -H 'Cache-Control: no-cache' "$url") || anon="000"

          case "$anon" in
            403)
              echo "Anonymous visitors are refused."
              ;;
            200)
              echo "::error::The site answered an anonymous request with 200. It is public. Either the upload did not include .htaccess, or the host is not applying it -- check that AllowOverride permits Require directives."
              exit 1
              ;;
            *)
              echo "::error::Expected 403 from an anonymous request, got '${anon}'."
              exit 1
              ;;
          esac

          if ! grep -q 'This site is not public yet' /tmp/gate.html; then
            echo "::error::The 403 body is not the login page. Either login.php is missing from the build or it is not exempted from Require env FB_ACCESS in .htaccess."
            exit 1
          fi

          # If the host stops executing PHP, login.php is served as source. It
          # deliberately holds no secrets, so this is a broken door rather than
          # an open one -- but it is still a site nobody can sign in to.
          if grep -q '<?php' /tmp/gate.html; then
            echo "::error::The login page came back as PHP source instead of being executed. The host is not running PHP for this directory, so nobody can sign in."
            exit 1
          fi

          # Keep the password out of argv, which is readable from the runner's
          # process list; curl reads the field from the file instead.
          pw=$(mktemp); chmod 600 "$pw"
          printf '%s' "${SITE_PASSWORD}" > "$pw"
          jar=$(mktemp); badjar=$(mktemp)

          login=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -c "$jar" \
            --data-urlencode "password@${pw}" --data-urlencode 'next=/' \
            "${origin}/login.php") || login="000"

          if [ "$login" != "302" ]; then
            echo "::error::The password did not sign in: expected a 302 from login.php, got '${login}'. The gate is closed to everyone, including its intended audience."
            exit 1
          fi

          auth=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -b "$jar" "$url") || auth="000"

          if [ "$auth" != "200" ]; then
            echo "::error::Signing in succeeded but the cookie it set does not open the site: expected 200, got '${auth}'. The token in .htaccess and the one in gate-secrets.php disagree."
            exit 1
          fi

          # The half that matters most, and the half a happy-path check misses:
          # that a wrong password is actually refused.
          bad=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -c "$badjar" \
            --data-urlencode "password=not-the-password-${GITHUB_RUN_ID}" \
            "${origin}/login.php") || bad="000"

          if [ "$bad" = "302" ]; then
            echo "::error::login.php accepted a password that is not the password. The gate is open to anyone who submits the form."
            exit 1
          fi

          badauth=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -b "$badjar" "$url") || badauth="000"

          if [ "$badauth" = "200" ]; then
            echo "::error::A failed login still produced a cookie that opens the site."
            exit 1
          fi

          secret=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "${origin}/gate-secrets.php?cb=${GITHUB_RUN_ID}") || secret="000"

          if [ "$secret" = "200" ]; then
            echo "::error::gate-secrets.php is reachable over HTTP. The deny rule in .htaccess is not being applied, and it holds the token that opens the site."
            exit 1
          fi

          rm -f "$pw" "$jar" "$badjar"
          echo "Gate refuses the public, opens with the password, and rejects a wrong one."
